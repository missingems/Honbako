# Keep query credentials (e.g. Kavita image API keys) and authorization headers
# out of the public reverse-proxy access log. $uri excludes query strings.
log_format honbako_review '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';
access_log /var/log/nginx/honbako-review-access.log honbako_review;
limit_req_zone $binary_remote_addr zone=honbako_review:10m rate=5r/s;
server {
    listen 80;
    listen [::]:80;
    server_name komga-review.honbako.xyz kavita-review.honbako.xyz suwayomi-review.honbako.xyz;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name komga-review.honbako.xyz;
    ssl_certificate /etc/letsencrypt/live/honbako-review/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/honbako-review/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 128k;
    add_header X-Content-Type-Options nosniff always;
    location / {
        limit_req zone=honbako_review burst=20 nodelay;
        limit_except GET POST { deny all; }
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_pass http://127.0.0.1:39101;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kavita-review.honbako.xyz;
    ssl_certificate /etc/letsencrypt/live/honbako-review/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/honbako-review/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 128k;
    add_header X-Content-Type-Options nosniff always;
    location / {
        limit_req zone=honbako_review burst=20 nodelay;
        limit_except GET POST { deny all; }
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_pass http://127.0.0.1:39102;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name suwayomi-review.honbako.xyz;
    ssl_certificate /etc/letsencrypt/live/honbako-review/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/honbako-review/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32k;
    add_header X-Content-Type-Options nosniff always;
    location / {
        limit_req zone=honbako_review burst=20 nodelay;
        limit_except GET POST { deny all; }
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 20s;
        # Never publish private Suwayomi39103. Only its allowlisted gateway.
        proxy_pass http://127.0.0.1:39104;
    }
}
