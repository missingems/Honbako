# Bootstrap/ACME only. Does not expose any provider before HTTPS activation.
server {
    listen 80;
    listen [::]:80;
    server_name komga-review.honbako.xyz kavita-review.honbako.xyz suwayomi-review.honbako.xyz;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
    location / { return 404; }
}
